<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATP PE Tournament</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding-bottom: 3rem; }
    .container { max-width: 480px; margin: 0 auto; padding: 1rem; }
    header { text-align: center; margin: 1rem 0 1.5rem; }
    h1 { color: #fbbf24; font-size: 1.5rem; font-weight: 900; letter-spacing: 0.05em; }
    .subtitle { color: #94a3b8; font-size: 0.75rem; margin-top: 0.25rem; }
    
    .tabs { display: flex; background: #1e293b; border-radius: 0.5rem; padding: 0.25rem; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 0.5rem; border: none; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; color: #94a3b8; background: transparent; transition: 0.2s; }
    .tab-btn.active { background: #f59e0b; color: #020617; font-weight: 700; }
    
    .card { background: #1e293b; border-radius: 0.75rem; padding: 1rem; margin-bottom: 0.75rem; border: 1px solid #334155; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .rank-num { font-weight: 900; width: 2rem; font-size: 0.9rem; }
    .top-rank { color: #fbbf24; }
    .player-name { font-weight: 700; font-size: 0.95rem; }
    .meta-text { font-size: 0.75rem; color: #94a3b8; }
    .score-badge { font-weight: 800; font-size: 0.95rem; color: #fbbf24; }
    
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.35rem; }
    select, textarea, input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem; color: #fff; font-size: 0.85rem; outline: none; }
    select:focus, textarea:focus { border-color: #f59e0b; }
    
    .btn-primary { width: 100%; background: #f59e0b; color: #020617; font-weight: 700; padding: 0.75rem; border: none; border-radius: 0.5rem; font-size: 0.85rem; cursor: pointer; }
    .btn-secondary { width: 100%; background: #334155; color: #fff; font-weight: 600; padding: 0.5rem; border: none; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer; margin-top: 0.5rem; }
    .btn-danger { width: 100%; background: transparent; border: 1px solid #ef4444; color: #f87171; font-weight: 600; padding: 0.5rem; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer; margin-top: 0.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ATP PE LADDER</h1>
      <p class="subtitle">Live PE Challenge Tracker</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="btn-standings" onclick="switchTab('standings')">Standings</button>
      <button class="tab-btn" id="btn-match" onclick="switchTab('match')">Log Match</button>
      <button class="tab-btn" id="btn-roster" onclick="switchTab('roster')">Roster</button>
    </div>

    <div id="view-standings">
      <div id="player-list"></div>
    </div>

    <div id="view-match" class="hidden">
      <div class="card">
        <div class="form-group">
          <label>Challenger (Attacking)</label>
          <select id="match-challenger" onchange="filterOpponents()"></select>
        </div>

        <div class="form-group">
          <label>Defender (Within 5 Ranks)</label>
          <select id="match-opponent"></select>
        </div>

        <div class="form-group">
          <label>Outcome</label>
          <select id="match-winner">
            <option value="challenger">Challenger Wins</option>
            <option value="opponent">Defender Holds</option>
          </select>
        </div>

        <div class="form-group">
          <label>Student Referee (+0.5 pts)</label>
          <select id="match-referee"></select>
        </div>

        <button class="btn-primary" onclick="recordMatch()">Record Result</button>
      </div>
    </div>

    <div id="view-roster" class="hidden">
      <div class="card">
        <label>Import Students (One name per line)</label>
        <textarea id="roster-input" rows="5" placeholder="Lucas&#10;Emma&#10;Noah&#10;Sophia"></textarea>
        <button class="btn-secondary" onclick="importStudents()">Import Class</button>
        <button class="btn-danger" onclick="resetData()">Clear Tournament Data</button>
      </div>
    </div>
  </div>

  <script>
    let players = JSON.parse(localStorage.getItem('pe_tourney_players')) || [
      { id: 1, name: "Lucas M.", points: 7.5, wins: 3, losses: 1, refs: 2 },
      { id: 2, name: "Emma R.", points: 6.0, wins: 3, losses: 1, refs: 0 },
      { id: 3, name: "Noah T.", points: 5.5, wins: 2, losses: 2, refs: 1 },
      { id: 4, name: "Sophia K.", points: 4.0, wins: 1, losses: 2, refs: 2 },
      { id: 5, name: "Oliver B.", points: 3.5, wins: 1, losses: 1, refs: 1 },
      { id: 6, name: "Mia D.", points: 2.0, wins: 0, losses: 3, refs: 4 }
    ];

    function persist() {
      localStorage.setItem('pe_tourney_players', JSON.stringify(players));
      render();
    }

    function switchTab(tab) {
      ['standings', 'match', 'roster'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        document.getElementById('btn-' + t).classList.remove('active');
      });
      document.getElementById('view-' + tab).classList.remove('hidden');
      document.getElementById('btn-' + tab).classList.add('active');

      if (tab === 'match') setupMatchOptions();
    }

    function render() {
      players.sort((a, b) => b.points - a.points);
      const list = document.getElementById('player-list');
      list.innerHTML = players.map((p, idx) => `
        <div class="card">
          <div class="row">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span class="rank-num ${idx < 3 ? 'top-rank' : ''}">#${idx + 1}</span>
              <div>
                <div class="player-name">${p.name}</div>
                <div class="meta-text">Refereed: ${p.refs} games</div>
              </div>
            </div>
            <div style="text-align: right;">
              <div class="score-badge">${p.points.toFixed(1)} pts</div>
              <div class="meta-text">${p.wins}W - ${p.losses}L</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setupMatchOptions() {
      players.sort((a, b) => b.points - a.points);
      const challengerSelect = document.getElementById('match-challenger');
      const refSelect = document.getElementById('match-referee');

      challengerSelect.innerHTML = players.map((p, i) => `<option value="${p.id}">${p.name} (#${i + 1})</option>`).join('');
      refSelect.innerHTML = '<option value="">-- No Referee --</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      filterOpponents();
    }

    function filterOpponents() {
      players.sort((a, b) => b.points - a.points);
      const cId = parseInt(document.getElementById('match-challenger').value);
      const cIdx = players.findIndex(p => p.id === cId);
      const minIdx = Math.max(0, cIdx - 5);

      const eligible = players.filter((p, i) => i >= minIdx && p.id !== cId);
      document.getElementById('match-opponent').innerHTML = eligible.map(p => {
        const pIdx = players.indexOf(p) + 1;
        return `<option value="${p.id}">${p.name} (#${pIdx})</option>`;
      }).join('');
    }

    function recordMatch() {
      const cId = parseInt(document.getElementById('match-challenger').value);
      const oId = parseInt(document.getElementById('match-opponent').value);
      const rId = parseInt(document.getElementById('match-referee').value);
      const winner = document.getElementById('match-winner').value;

      if (!cId || !oId || cId === oId) return alert('Select two distinct players.');

      const cIdx = players.findIndex(p => p.id === cId);
      const oIdx = players.findIndex(p => p.id === oId);
      const challenger = players[cIdx];
      const opponent = players[oIdx];
      const rankDiff = Math.max(0, cIdx - oIdx);

      if (winner === 'challenger') {
        challenger.points += (1.0 + (rankDiff * 0.5));
        challenger.wins++;
        opponent.losses++;
      } else {
        opponent.points += 1.0;
        opponent.wins++;
        challenger.points += 0.5;
        challenger.losses++;
      }

      if (rId) {
        const referee = players.find(p => p.id === rId);
        if (referee && referee.id !== cId && referee.id !== oId) {
          referee.points += 0.5;
          referee.refs++;
        }
      }

      persist();
      switchTab('standings');
    }

    function importStudents() {
      const val = document.getElementById('roster-input').value.trim();
      if (!val) return;
      const names = val.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      players = names.map((name, i) => ({ id: Date.now() + i, name, points: 0.0, wins: 0, losses: 0, refs: 0 }));
      document.getElementById('roster-input').value = '';
      persist();
      switchTab('standings');
    }

    function resetData() {
      if (confirm('Clear all player data and reset scores?')) {
        players = [];
        persist();
      }
    }

    render();
  </script>
</body>
</html>
